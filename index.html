<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizador Web Interactivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Formulario / Card -->
    <form id="form-preferencias">
        <!-- Contenedor dinámico de bienvenida -->
        <div id="contenedor-bienvenida"></div>

        <div>
            <label for="nombre-usuario">Nombre de Usuario:</label>
            <input type="text" id="nombre-usuario" required>
        </div>
        <div>
            <label for="color-fondo">Color de Fondo:</label>
            <input type="color" id="color-fondo" value="#ffffff">
        </div>
        <div>
            <label for="tema-visual">Tema Visual:</label>
            <select id="tema-visual">
                <option value="claro">Modo Claro</option>
                <option value="oscuro">Modo Oscuro</option>
            </select>
        </div>
        <button type="submit" id="btn-guardar">Guardar Preferencias</button>
        <button type="button" id="btn-restablecer">Restablecer Interfaz</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
